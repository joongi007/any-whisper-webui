[project]
name = "ai"
version = "0.1.0"
description = "any-whisper-webui — AI worker (NATS-driven)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "nats-py>=2.9",
    "ulid-py>=1.1",
    "anyio>=4.6",
    # numba (pulled in by openai-whisper) lags numpy: the latest numba supports
    # numpy <2.3, so leaving numpy uncapped lets the resolver pick numpy 2.3 and
    # then backtrack numba to an ancient 0.53.x that fails to build on py3.12.
    # Cap numpy to numba's ceiling and floor numba to a py3.12-capable build.
    "numpy>=2.1,<2.3",
    "numba>=0.61",
    "soundfile>=0.12",

    # whisper backends
    "faster-whisper>=1.1.0",
    "openai-whisper>=20240930",
    "transformers>=4.46",
    "torch>=2.5",
    "torchaudio>=2.5",
    "accelerate>=1.1",
    # CTranslate2 (the engine under faster-whisper) is CUDA-12 only as of 4.7.x.
    # torch picks the latest CUDA wheel (cu13 on a CUDA-13 host), so we bundle
    # cu12 cuBLAS ourselves and expose it via LD_LIBRARY_PATH (set in Dockerfile).
    # cuDNN 9 from torch's wheel is ABI-compatible and reused as-is.
    "nvidia-cublas-cu12>=12.4",

    # pre/post-processing
    "silero-vad>=5.1",
    "pyannote.audio>=3.3",
    "demucs>=4.0",

    # text translation
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "deepl>=1.20",

    # youtube — keep recent; YouTube changes its player often and old yt-dlp
    # gets 403'd. Rebuild the ai image periodically to pull the latest.
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
ai = "ai.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
